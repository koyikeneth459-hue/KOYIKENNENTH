<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunlight Cleaning Services - Get in Touch</title>
</head>
<body>

    <header>
        <h1>Sunlight Professional Cleaning Services</h1>
        <p>Book a Service or Request a Custom Quote</p>
    </header>

    <nav>
        <a href="index.html">Home</a> | 
        <a href="about.html">Company Profile</a> | 
        <a href="services.html">Packages & Rates</a> | 
        <a href="gallery.html">Project Showcase</a> | 
        <a href="contact.html">Get in Touch</a>
    </nav>

    <main>
        <section>
            <h2>Service Booking & Inquiry Form</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Information</legend>

                    <label for="client_name">Client Full Name:</label><br>
                    <input type="text" id="client_name" name="client_name" required><br><br>

                    <label for="client_email">Email Address:</label><br>
                    <input type="email" id="client_email" name="client_email" required><br><br>

                    <label for="service_type">Select Desired Service:</label><br>
                    <select id="service_type" name="service_type">
                        <option value="home">Home Deep Clean</option>
                        <option value="office">Corporate Office Care</option>
                        <option value="carpet">Carpet & Upholstery Care</option>
                    </select><br><br>

                    <label for="notes">Additional Service Details:</label><br>
                    <textarea id="notes" name="notes" rows="5" cols="45"></textarea><br><br>

                    <button type="submit">Submit Request</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sunlight Professional Cleaning Services. All rights reserved.</p>
    </footer>

</body>
</html>
